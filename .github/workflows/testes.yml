name: Testes Automatizados

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  testes-unitarios:
    name: Testes Unitários
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v3
    
    - name: Configurar Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Instalar dependências
      run: go mod download
    
    - name: Executar testes unitários
      run: go test ./internal/gestao_clientes/... ./internal/processamento_eventos/... ./internal/dominio/... -v -short
    
    - name: Gerar relatório de cobertura
      run: |
        go test ./internal/gestao_clientes/... ./internal/processamento_eventos/... ./internal/dominio/... -coverprofile=coverage.out -short
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload de cobertura
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage.html

  testes-integracao:
    name: Testes de Integração
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mundo_invest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v3
    
    - name: Configurar Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Instalar dependências
      run: go mod download
    
    - name: Executar migrations
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d mundo_invest -f migrations_simple/001_criar_schemas.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d mundo_invest -f migrations_simple/002_criar_sequencias.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d mundo_invest -f migrations_simple/003_criar_tabela_cliente.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d mundo_invest -f migrations_simple/004_criar_tabela_evento.sql
    
    - name: Executar testes de integração
      run: go test ./internal/shared/database/... -v -tags=integration
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: mundo_invest
        DB_SSLMODE: disable

  build:
    name: Build do Projeto
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v3
    
    - name: Configurar Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Instalar dependências
      run: go mod download
    
    - name: Build do projeto
      run: go build -o bin/server ./cmd/server
    
    - name: Upload do binário
      uses: actions/upload-artifact@v3
      with:
        name: server-binary
        path: bin/server

  lint:
    name: Lint do Código
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v3
    
    - name: Configurar Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Instalar golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    
    - name: Executar lint
      run: golangci-lint run ./...

  coverage-check:
    name: Verificação de Cobertura
    runs-on: ubuntu-latest
    needs: testes-unitarios
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v3
    
    - name: Configurar Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Instalar dependências
      run: go mod download
    
    - name: Executar testes com cobertura
      run: go test ./... -coverprofile=coverage.out -short
    
    - name: Verificar cobertura mínima
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Cobertura total: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "Cobertura abaixo de 80%"
          exit 1
        fi
    
    - name: Upload de cobertura
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
